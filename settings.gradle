pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    // 1.0.0 and on drop JvmVendorSpec.IBM_SEMERU, which Gradle 9 removed; ModDevGradle's run tasks reach the resolver
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'goo'
