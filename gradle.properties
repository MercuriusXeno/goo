org.gradle.jvmargs=-Xmx6G --enable-native-access=ALL-UNNAMED
# No build script loads a project class in the daemon, so it holds no worktree file (decision daemon-back-on);
# an idle daemon dies after ten minutes (decision idle-daemon-dies-in-minutes).
org.gradle.daemon=true
org.gradle.daemon.idletimeout=600000
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Versions
minecraft_version=26.1
minecraft_version_range=[26.1,)
neo_version=26.1.0.1-beta
neo_version_range=[26.1.0.0,)
loader_version_range=[4,)

# Mod metadata
mod_id=goo
mod_name=Goo
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=com.mercuriusxeno.goo
mod_authors=MercuriusXeno,gabb.png
mod_description=Decompose items into typed goo blobs and reconstitute them, with each goo type having innate abilities.
