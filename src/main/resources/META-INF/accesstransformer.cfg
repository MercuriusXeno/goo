# RenderSection.uploadedTime - a mesh moved across lunar's seam keeps the time it was first uploaded, so a later
# rebuild of its section draws at once rather than fading in from the sky
# (decision moon-wraps-at-its-border-like-the-zone)
public net.minecraft.client.renderer.chunk.SectionRenderDispatcher$RenderSection uploadedTime

