# Access Transformers for Goo mod

# Server-side quickcraft fields (AbstractContainerMenu) - needed by GooQuickCraftMixin
public net.minecraft.world.inventory.AbstractContainerMenu quickcraftType
public net.minecraft.world.inventory.AbstractContainerMenu quickcraftStatus
public net.minecraft.world.inventory.AbstractContainerMenu quickcraftSlots

# LivingEntity.jumping - read by the slime coat's bounce, which ramps while jump is held
# (decision bounce-ramps-jump-height-while-jump-is-held)
public net.minecraft.world.entity.LivingEntity jumping

# Client-side quickcraft fields (AbstractContainerScreen) - needed by GooQuickCraftScreenMixin
public net.minecraft.client.gui.screens.inventory.AbstractContainerScreen quickCraftingType
public net.minecraft.client.gui.screens.inventory.AbstractContainerScreen quickCraftingRemainder

# CauldronInteraction.Dispatcher.put - package-private in vanilla, needed for goo cauldron interactions
public net.minecraft.core.cauldron.CauldronInteraction$Dispatcher put(Lnet/minecraft/world/item/Item;Lnet/minecraft/core/cauldron/CauldronInteraction;)V

# TransmuteRecipe.result - needed to extract output item without a real CraftingInput
public net.minecraft.world.item.crafting.TransmuteRecipe result

# ItemEntity.age - needed by GooItem.absorbNeighbors for min(ages) on ground merge
public net.minecraft.world.entity.item.ItemEntity age

# PostChain.passes / PostPass.customUniforms - needed by NetherLensEffect to
# write fresh LensConfig uniform bytes into the active black-hole lens
