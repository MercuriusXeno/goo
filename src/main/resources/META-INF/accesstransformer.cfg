public net.minecraft.client.renderer.PostChain passes
public net.minecraft.client.renderer.PostPass customUniforms

# The portal view pass (decision portals-link-by-looking-through-portal-vision): PortalView draws the
# level once per visible linked portal from a camera mirrored through the pair, into its own target
# swapped in for the main one, over the sections it picks for that camera, with the frame's fog and
# resource pool, before the frame's own extraction overwrites the level render state.
public-f net.minecraft.client.Minecraft mainRenderTarget
public net.minecraft.client.renderer.GameRenderer fogRenderer
public net.minecraft.client.renderer.GameRenderer resourcePool
public net.minecraft.client.renderer.GameRenderer gameRenderState
public net.minecraft.client.renderer.GameRenderer globalSettingsUniform
