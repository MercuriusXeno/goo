public com.mojang.blaze3d.platform.cursor.CursorType <init>(Ljava/lang/String;J)V

# ClientInput.moveVector - zeroed while Astral's gate holds the caster still
# (decision gate-fixates-your-view-on-the-moon-until-it-takes-you)
public net.minecraft.client.player.ClientInput moveVector

# MaterialRuleContext.randomState - lunar's goo material conditions read the random state's seeded noises at any
# column, as the craters and the sea cavern their density functions draw
# (decisions lunar-ground-gains-meteoric-iron-impact-glass-breccia-and-crater-ice,
# lunar-underground-changes-by-depth-down-to-a-molten-iron-sea).
public net.minecraft.world.level.levelgen.material.MaterialRuleContext randomState

# RenderTarget.depthFormat - DepthCopyTarget builds each depth copy in its source's own depth format, and reads
# whether that format carries a stencil, as 26.2's useStencil told it
# (decision diagnose-and-correct-the-crash-in-every-depth-copying-visual).
public com.mojang.blaze3d.pipeline.RenderTarget depthFormat

# NoiseStack's layers - read by RepeatingNoise, which refits each layer so lunar's noise repeats every 15,000,000 blocks
# (decision moon-wraps-at-its-border-like-the-zone)
public net.minecraft.world.level.levelgen.synth.NoiseStack layers
public net.minecraft.world.level.levelgen.synth.NoiseStack$Layer

# PlayerChunkSender.pendingChunks - a crossing of lunar's seam keeps only the chunks the server had already sent,
# which are the view's chunks still waiting here
# (decision moon-wraps-at-its-border-like-the-zone)
public net.minecraft.server.network.PlayerChunkSender pendingChunks

