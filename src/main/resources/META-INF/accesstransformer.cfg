public net.minecraft.client.renderer.GameRenderer bobView(Lnet/minecraft/client/renderer/state/level/CameraRenderState;Lcom/mojang/blaze3d/vertex/PoseStack;)V
public net.minecraft.client.renderer.LevelRenderer visibleSections
public net.minecraft.client.renderer.LevelRenderer viewArea
public-f net.minecraft.client.renderer.LevelRenderer cloudRenderer
public net.minecraft.client.Camera setupPerspective(FFFFF)V
public net.minecraft.client.Camera prepareCullFrustum(Lorg/joml/Matrix4fc;Lorg/joml/Matrix4f;Lnet/minecraft/world/phys/Vec3;)V
public net.minecraft.client.Camera createProjectionMatrixForCulling()Lorg/joml/Matrix4f;

# Camera.eyeHeight / eyeHeightOld - CameraEye.eyeHeight starts Float's wind at the camera's eased eye
# height above the feet, read whole on a game tick (decision diagnose-and-correct-eye-drawn-visuals-jumping-on-sneak).
public net.minecraft.client.Camera eyeHeight
public net.minecraft.client.Camera eyeHeightOld

# ItemStackRenderState.firstLayer / LayerRenderState.itemTransform - GloveArmLayer reads the held glove's
# third-person display transform to cut the arm at the glove's cuff (decision diagnose-and-correct-the-arm-through-the-glove).
public net.minecraft.client.renderer.item.ItemStackRenderState firstLayer()Lnet/minecraft/client/renderer/item/ItemStackRenderState$LayerRenderState;
public net.minecraft.client.renderer.item.ItemStackRenderState$LayerRenderState itemTransform

# CursorType.<init> - private in vanilla, which builds only standard cursors; PointerHand wraps the
