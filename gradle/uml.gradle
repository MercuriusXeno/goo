// PlantUML class diagrams through elnarion's generator, a tools dependency.
// Each slice runs com.mercuriusxeno.goo.tools.architecture.UmlSliceWriter
// as a forked JavaExec, so no project class loads inside the build JVM
// (decision uml-generator-runs-in-tools). Slices are data; one task per slice
// keeps each renewable. Aggregate `umlDiagrams` regenerates everything. Add a
// slice by adding an entry to umlSlices below.
def umlSlices = [
        [name    : 'Ability',
         file    : 'ability.puml',
         packages: ['com.mercuriusxeno.goo.ability',
                    'com.mercuriusxeno.goo.ability.world',
                    'com.mercuriusxeno.goo.ability.mob',
                    'com.mercuriusxeno.goo.block.ability']],
        [name    : 'Machine',
         file    : 'machine.puml',
         packages: ['com.mercuriusxeno.goo.block',
                    'com.mercuriusxeno.goo.block.fluid',
                    'com.mercuriusxeno.goo.block.gasket']],
        [name    : 'ClientCore',
         file    : 'client-core.puml',
         packages: ['com.mercuriusxeno.goo.client',
                    'com.mercuriusxeno.goo.client.machine']],
        [name    : 'ClientAbility',
         file    : 'client-ability.puml',
         packages: ['com.mercuriusxeno.goo.client.ability']],
        [name    : 'ClientBer',
         file    : 'client-ber.puml',
         packages: ['com.mercuriusxeno.goo.client.ber',
                    'com.mercuriusxeno.goo.client.ber.style',
                    'com.mercuriusxeno.goo.client.model']],
        [name    : 'ClientHudOverlay',
         file    : 'client-hud-overlay.puml',
         packages: ['com.mercuriusxeno.goo.client.hud',
                    'com.mercuriusxeno.goo.client.overlay']],
        [name    : 'ClientInteraction',
         file    : 'client-interaction.puml',
         packages: ['com.mercuriusxeno.goo.client.radial',
                    'com.mercuriusxeno.goo.client.throwing',
                    'com.mercuriusxeno.goo.client.tooltip']],
        [name    : 'ClientParticle',
         file    : 'client-particle.puml',
         packages: ['com.mercuriusxeno.goo.client.particle']],
]

// The slices land beside the other architecture documents (gradle/architecture.gradle).
def umlOutputDir = new File(architectureOutDir, 'class')

umlSlices.each { slice ->
    tasks.register("umlDiagrams${slice.name}", JavaExec) {
        description = "Generates PlantUML class diagram for ${slice.packages.join(', ')}"
        group = 'documentation'
        dependsOn tasks.named('compileJava')
        classpath = sourceSets.tools.runtimeClasspath
        mainClass = 'com.mercuriusxeno.goo.tools.architecture.UmlSliceWriter'
        workingDir = project.projectDir
        args([umlOutputDir.absolutePath, slice.file] + slice.packages)
        outputs.upToDateWhen { false }
    }
}

tasks.register('umlDiagrams') {
    description = 'Regenerates all UML class diagram slices'
    group = 'documentation'
    dependsOn umlSlices.collect { "umlDiagrams${it.name}" }
}
